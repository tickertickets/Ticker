<!DOCTYPE html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Ticker — แอปรีวิวหนังสำหรับคนรักหนัง</title>
    <meta name="description" content="Ticker — แอปบันทึกหนังสำหรับคนรักหนัง สะสม Ticket การ์ดตั๋วของหนังที่ดู สร้าง Chains รายการหนังแชร์กับเพื่อน และค้นพบหนังที่ควรดูต่อไป" />
    <meta name="keywords" content="Ticker, Tickets, Chains, แอปหนัง, รีวิวหนัง, ดูหนัง, บันทึกหนัง, film diary, movie tracker, watchlist, ชุมชนคนรักหนัง, ซีรีย์, สังคมหนัง, ค้นหาหนัง" />
    <link rel="canonical" href="https://ticker-tickets.vercel.app/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- ── iOS Add-to-Home-Screen / PWA install ─────────────────────────────
         iOS Safari ignores manifest.icons and only honours `apple-touch-icon`
         + `apple-mobile-web-app-*` meta tags. Without these, the home-screen
         icon shows a screenshot thumbnail instead of the Ticker logo and the
         standalone display flags don't apply. Sizes 180 covers iPhone 12 Pro
         Max (highest pixel-density target). The status-bar style is
         "black-translucent" so the app draws under the notch (safe-area
         insets are already handled by the React layout).
    -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ticker" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph -->
    <meta property="og:title" content="Ticker — แอปรีวิวหนังสำหรับคนรักหนัง" />
    <meta property="og:description" content="สะสม Ticket การ์ดตั๋วของทุกเรื่องที่ดู สร้าง Chains รายการหนังแชร์กับเพื่อน และค้นพบหนังที่ต้องดูต่อไป มาร่วมชุมชนคนรักหนังบน Ticker" />
    <meta property="og:url" content="https://ticker-tickets.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ticker — แอปรีวิวหนังสำหรับคนรักหนัง" />
    <meta name="twitter:description" content="บันทึกหนังที่ดูเป็น Ticket สร้าง Chains ชวนเพื่อนดูหนังด้วยกัน ค้นพบหนังที่น่าสนใจ เข้าร่วม Ticker ชุมชนคนรักหนัง" />

    <!-- Block Google auto-translate for all modes -->
    <meta name="google" content="notranslate" />
    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="eRrNlnK3-oXxOmqJFMtLSgmQF0aSD__hFBmlk1XydhA" />

    <!-- Theme: prevent flash before Tailwind CSS loads -->
    <style>
      html            { background-color: #ffffff; color: #121212; }
      html.dark       { background-color: #000000; color: #ededed; }
      body            { background-color: inherit; }
    </style>
    <script>
      (function () {
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.startsWith('ticker_theme') && localStorage.getItem(k) === 'dark') {
              document.documentElement.classList.add('dark');
              break;
            }
          }
        } catch (e) {}
      })();
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
